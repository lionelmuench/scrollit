<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Scrollit — Endless</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
        .timer-bar-track {
            width: 100%;
            max-width: 340px;
            height: 6px;
            background: #e5e7eb;
            border-radius: 100px;
            margin: 16px auto;
            overflow: hidden;
        }

        .timer-bar-fill {
            height: 100%;
            width: 100%;
            background: #ef4444;
            border-radius: 100px;
            transition: width 0.25s linear;
        }
    </style>
</head>

<body>

    <!-- Toast container -->
    <div id="toast-container"></div>

    <!-- Header -->
    <header class="header">
        <div class="header-brand">
            <a href="index.html" class="btn-home" aria-label="Home">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8" />
                    <path
                        d="M3 10a2 2 0 0 1 .709-1.528l7-5.999a2 2 0 0 1 2.582 0l7 5.999A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                </svg>
            </a>
            <h1 class="logo">SCROLLIT</h1>
        </div>
    </header>

    <!-- Mode label -->
    <div class="target-section">
        <span class="target-label">ENDLESS</span>
    </div>

    <!-- Timer bar -->
    <div class="timer-bar-track">
        <div class="timer-bar-fill" id="timer-bar"></div>
    </div>

    <!-- Scroll wheels + buttons -->
    <div class="game-area">
        <div class="wheels-row">
            <div class="letter-column" data-index="0"></div>
            <div class="letter-column" data-index="1"></div>
            <div class="letter-column" data-index="2"></div>
            <div class="letter-column" data-index="3"></div>
            <div class="buttons-col">
                <button class="btn-check" id="checkmark-btn" aria-label="Submit guess">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12" />
                    </svg>
                </button>
                <button class="btn-reset" id="reset-btn" aria-label="Reset wheels">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10" />
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10" />
                    </svg>
                </button>
            </div>
        </div>
    </div>

    <!-- Score counter -->
    <div class="steps-display">
        <span class="steps-label">Score</span>
        <span class="steps-count" id="score-count">0</span>
    </div>

    <!-- Word chain / history -->
    <div class="chain-section">
        <div class="chain-track" id="chain-track">
            <!-- words will be inserted here -->
        </div>
    </div>

    <details class="inline-help">
        <summary class="inline-help-summary">
            <span class="inline-help-title">How to play</span>
            <span class="inline-help-meta">Tap to expand</span>
        </summary>
        <ul class="inline-help-list">
            <li>Change exactly one letter each turn.</li>
            <li>Every guess must be a real 4-letter word.</li>
            <li>You cannot change the same slot twice in a row.</li>
            <li>Every valid word resets the 15-second timer.</li>
        </ul>
    </details>

    <!-- Game over overlay -->
    <div class="overlay" id="gameover-overlay">
        <div class="win-card">
            <div class="win-emoji">⏱️</div>
            <h2 class="win-title" id="gameover-title">Time's Up!</h2>
            <div class="win-stats">
                <div class="stat-block">
                    <span class="stat-number" id="gameover-score">0</span>
                    <span class="stat-label">Score</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-block">
                    <span class="stat-number" id="gameover-highscore">0</span>
                    <span class="stat-label">Best</span>
                </div>
            </div>
            <div class="win-chain-label">Your Path</div>
            <div class="win-chain" id="gameover-chain"></div>
            <div class="win-buttons">
                <button class="btn-play-again" id="btn-play-again">Play Again</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
    <script src="endless.js"></script>
</body>

</html>
