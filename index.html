<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Scrollit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
    <style>
        body.home-page {
            justify-content: center;
            min-height: 100dvh;
            padding-bottom: 0;
        }

        .home-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
            padding: 0 24px;
            max-width: 400px;
            width: 100%;
        }

        .home-brand {
            text-align: center;
        }

        .home-logo {
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: 0.22em;
            color: #1a1a2e;
            margin-bottom: 8px;
        }

        .home-tagline {
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #9ca3af;
        }




        /* Mode buttons */
        .home-modes {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .mode-btn {
            display: flex;
            align-items: center;
            gap: 16px;
            width: 100%;
            padding: 18px 22px;
            border: 2px solid #e5e7eb;
            border-radius: 16px;
            background: #fff;
            cursor: pointer;
            transition: border-color 0.2s ease;
            text-decoration: none;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.04);
        }

        .mode-btn:active {
            transform: scale(0.98);
        }

        /* Challenge */
        .mode-btn.challenge:hover {
            border-color: #4f46e5;
        }

        .mode-btn.challenge .mode-icon {
            background: #4f46e5;

        }

        /* Zen */
        .mode-btn.zen:hover {
            border-color: #14b8a6;
        }

        .mode-btn.zen .mode-icon {
            background: #14b8a6;

        }

        /* Endless */
        .mode-btn.endless:hover {
            border-color: #f59e0b;
        }

        .mode-btn.endless .mode-icon {
            background: #f59e0b;

        }

        .mode-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .mode-icon svg {
            width: 24px;
            height: 24px;
        }

        .mode-name {
            font-size: 1rem;
            font-weight: 800;
            color: #1a1a2e;
            letter-spacing: 0.04em;
        }



        .mode-arrow {
            margin-left: auto;
            color: #d1d5db;
        }
    </style>
</head>

<body class="home-page">

    <div class="home-container">

        <!-- Brand -->
        <div class="home-brand">
            <h1 class="home-logo">SCROLLIT</h1>
            <p class="home-tagline">By Insite Web Design</p>
        </div>

        <!-- Mode buttons -->
        <nav class="home-modes">

            <!-- Challenge -->
            <a href="challenge.html" class="mode-btn challenge">
                <div class="mode-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polygon
                            points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2" />
                    </svg>
                </div>
                <span class="mode-name">Challenge</span>
                <div class="mode-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6" />
                    </svg>
                </div>
            </a>

            <!-- Zen -->
            <a href="zen.html" class="mode-btn zen">
                <div class="mode-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M8 14s1.5 2 4 2 4-2 4-2" />
                        <line x1="9" y1="9" x2="9.01" y2="9" />
                        <line x1="15" y1="9" x2="15.01" y2="9" />
                    </svg>
                </div>
                <span class="mode-name">Zen</span>
                <div class="mode-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6" />
                    </svg>
                </div>
            </a>

            <!-- Endless -->
            <a href="endless.html" class="mode-btn endless">
                <div class="mode-icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                        <polyline points="17 6 23 6 23 12" />
                    </svg>
                </div>
                <span class="mode-name">Endless</span>
                <div class="mode-arrow">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="9 18 15 12 9 6" />
                    </svg>
                </div>
            </a>

        </nav>

    </div>

</body>

</html>
